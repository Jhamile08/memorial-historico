<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memoria Amazónica</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>🌿 Memoria de Sonidos del Amazonas 🌿</h1>
  <button id="restart">Reiniciar partida</button>
</header>

<main class="game-layout">
  <aside class="score-panel" aria-label="Mejores tiempos">
    <div class="timer-box">
      <span class="panel-label">Tiempo</span>
      <strong id="timer">00:00.0</strong>
    </div>

    <section>
      <h2>Mejores tiempos</h2>
      <ol id="best-times" class="best-times"></ol>
    </section>
  </aside>

  <section id="board" aria-label="Tablero de memoria"></section>
</main>

<div id="win-message" class="win-message" hidden>
  <div class="win-card">
    <button id="close-win-message" class="close-modal" type="button" aria-label="Cerrar mensaje">×</button>
    <h2>Felicitaciones</h2>
    <p id="win-text">Has completado el memorial amazónico</p>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
